appId: com.gradatim.editor
productName: Gradatim
directories:
  output: release
files:
  - package.json
  - electron/main.js
  - electron/preload.js
  - electron/config-store.js
  - renderer/dist/**
asar: false
extraMetadata:
  main: electron/main.js
win:
  target:
    - target: dir
      arch:
        - x64
mac:
  target: dmg
linux:
  target:
    - AppImage

